[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codigo-sintetico"
version = "2.2.3"
description = "Reference patterns for production multi-agent AI systems: budgets, audit trails, eval gates, bounded autonomy. Companion code of the book Synthetic Code."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sergio Perez Ruiz" }]
license = { text = "MIT" }
keywords = ["ai-agents", "multi-agent", "llm", "llmops", "governance", "evals", "audit-log", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Repository = "https://github.com/sergioide007/synthetic-code"
Issues = "https://github.com/sergioide007/synthetic-code/issues"
Changelog = "https://github.com/sergioide007/synthetic-code/blob/main/CHANGELOG.md"

[project.scripts]
sintetico = "sintetico.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
structured = ["pydantic>=2.5"]
faiss = ["numpy>=1.26", "faiss-cpu>=1.8"]
kafka = ["confluent-kafka>=2.3"]
rapidfuzz = ["rapidfuzz>=3.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
local = ["requests>=2.31"]
redis = ["redis>=5.0"]
mcp = ["jsonschema>=4.20"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
postgres = ["psycopg2-binary>=2.9"]
all = ["pydantic>=2.5", "numpy>=1.26", "faiss-cpu>=1.8", "confluent-kafka>=2.3", "anthropic>=0.40", "openai>=1.50", "requests>=2.31", "redis>=5.0", "jsonschema>=4.20",
       "fastapi>=0.115", "uvicorn[standard]>=0.32", "psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "hypothesis>=6.100", "pyyaml>=6.0", "pydantic>=2.5", "numpy>=1.26", "faiss-cpu>=1.8", "confluent-kafka>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sintetico_api = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Deliberately conservative selection: pyflakes (F: real bugs such as unused
# imports/variables or undefined names) + syntax errors (E9). Purely
# stylistic rules (E501 line length, D docstrings, etc.) are left off on
# purpose: a lint that is strict about what matters (bugs) is worth more
# than a noisy one about what does not.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The __init__.py files re-export symbols on purpose (public API of the package).
"src/*/__init__.py" = ["F401"]
