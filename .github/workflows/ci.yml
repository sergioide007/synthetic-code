name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  # Every test runs against simulated providers (MockProvider / an Anthropic
  # SDK injected into sys.modules): no real API key is needed for this
  # workflow to pass.
  SINTETICO_API_DB_PATH: ci_traces.db
  # Postgres for the PostgresTraceStore tests (service defined below)
  SINTETICO_TEST_POSTGRES_URL: postgresql://sintetico:sintetico@localhost:5432/sintetico_test
  # Redis for the RedisBudgetBackend tests (service defined below)
  SINTETICO_TEST_REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sintetico
          POSTGRES_PASSWORD: sintetico
          POSTGRES_DB: sintetico_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the project (all extras + dev)
        run: pip install -e ".[all,dev]"

      - name: Run the test suite with coverage
        run: |
          pytest tests/ -v \
            --cov=sintetico --cov=trazabilidad --cov=sintetico_api \
            --cov-report=term-missing --cov-report=xml

      - name: Upload the coverage report as an artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: "Ruff check (blocking: real bugs such as unused imports or undefined names)"
        run: ruff check src/ tests/ demos/ examples/ scripts/
      - name: Ruff format --check (informational)
        # Not blocking: formatting is reported as a signal only, until
        # `ruff format .` is applied once across the code base.
        run: ruff format --check src/ tests/ demos/
        continue-on-error: true

  smoke-test-server:
    name: Server smoke test (real uvicorn)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project with API support
        run: pip install -e ".[api]"

      - name: Start uvicorn in the background
        run: |
          nohup uvicorn sintetico_api.main:app --host 127.0.0.1 --port 8000 \
            > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the server to respond
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "Server up after $i attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "The server did not respond in time"
          cat uvicorn.log
          exit 1

      - name: Check /api/v1/health
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/health | tee health.json
          grep -q '"status":"ok"' health.json || grep -q '"status": "ok"' health.json

      - name: Check that the dashboard is served
        run: curl -sf http://127.0.0.1:8000/ | grep -qi "Agent Observability"

      - name: Check that Swagger UI responds
        run: curl -sf http://127.0.0.1:8000/docs | grep -qi "swagger"

      - name: Functional smoke test (run one pillar end to end)
        run: |
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/runs/orchestration \
            -H "Content-Type: application/json" -d '{"team_id":"ci"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['summary']['total_cost_usd'] >= 0; print('OK: run completed with a valid summary')"

      - name: Dump the server logs (if something failed)
        if: failure()
        run: cat uvicorn.log || true

      - name: Stop uvicorn
        if: always()
        run: kill $(cat uvicorn.pid) 2>/dev/null || true

  build-package:
    name: Package build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check that the wheel installs cleanly in a new venv
        run: |
          python -m venv /tmp/venv-check
          /tmp/venv-check/bin/pip install dist/*.whl
          /tmp/venv-check/bin/python -c "import sintetico, trazabilidad; print('sintetico', sintetico.__version__)"
          /tmp/venv-check/bin/sintetico --version
          /tmp/venv-check/bin/python -c "import sintetico.devops, sintetico.cli; print('devops + cli importables from the wheel')"

  quality:
    name: Static analysis, dependency audit, independent verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and analysis tools
        run: pip install -e ".[dev]" ruff mypy bandit pip-audit
      - name: "Full verification script (tests, independent jq+openssl checks, ruff, mypy, bandit)"
        run: |
          sudo apt-get install -y -q jq >/dev/null
          sh scripts/verify.sh
      - name: "Dependency audit (report only, so a new advisory does not break unrelated pull requests)"
        run: pip-audit -r requirements.txt || true

  kafka-integration:
    name: Real Kafka broker (apache/kafka, KRaft)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with test dependencies
        run: pip install -e ".[dev]"
      - name: Wait for the broker to accept connections
        run: |
          python - <<'PY'
          import time
          from sintetico import KafkaBus
          deadline = time.time() + 120
          while True:
              try:
                  KafkaBus("localhost:9092", flush_timeout=3).ensure_topics(["ci-probe"])
                  break
              except Exception as exc:
                  if time.time() > deadline:
                      raise
                  print("waiting for Kafka:", exc)
                  time.sleep(3)
          PY
      - name: Kafka tests including the real-broker class
        run: pytest tests/test_kafka_bus.py tests/test_distributed.py tests/test_distributed_gateway.py -q
        env:
          SINTETICO_TEST_KAFKA: localhost:9092

